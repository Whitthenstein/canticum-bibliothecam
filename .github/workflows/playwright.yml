name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  e2e:
    name: E2E Tests
    env: 
      ADMIN_PASSWORD: ${{secrets.ADMIN_PASSWORD}}
      TURSO_DB_TOKEN: ${{secrets.TURSO_DB_TOKEN}}
      TURSO_DB_CONNECTION_URL: ${{secrets.TURSO_DB_CONNECTION_URL}}
      GOOGLE_API_CREDS: ${{secrets.GOOGLE_API_CREDS}}
      GDRIVE_STORAGE_FOLDER_ID: ${{secrets.GDRIVE_STORAGE_FOLDER_ID}}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g npm && npm install --force
      - name: Install Turso
        run: curl -sSfL https://get.tur.so/install.sh | bash
      - name: Install Playwright Browsers
        run: npm exec playwright install --with-deps
      - name: Build the app
        run: npm run build
      - name: Setup DB
        run: npm run db:migrate
      - name: Run Playwright tests
        run: npm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
